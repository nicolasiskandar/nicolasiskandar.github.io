projects:
  - name: "Raft KV Store"
    description: "Resilient distributed key-value store built on the Raft consensus algorithm, featuring leader elections, log replication, fault tolerance, snapshotting, log compaction, TCP networking, and linearizability testing with Jepsen-style fault injection"
    image: "assets/projects/raft-kv-store-logo.png"
    github: "https://github.com/nicolasiskandar/raft-kv-store"
    language: "Rust"
  - name: "Bracha Byzantine Reliable Broadcast"
    description: "Implementation of Bracha's asynchronous Byzantine Reliable Broadcast protocol in Rust, featuring fault-tolerant message propagation, adversarial network simulation, Byzantine fault injection, TCP networking, and a Coq formal specification with machine-checked integrity and quorum-intersection proofs"
    image: "assets/projects/bracha-rbc-logo.jpg"
    github: "https://github.com/nicolasiskandar/bracha-rbc"
    language: "Rust, Coq"
    image_fit: "cover"
  - name: "OS Lab"
    description: "Collection of low-level systems programming projects for Linux and x86, featuring a bootable 32-bit kernel, container runtime using Linux namespaces, custom filesystem, preemptive threading runtime, real-time scheduling algorithms, memory allocator, and UNIX shell, with hand-written assembly context switching and memory routines"
    image: "assets/projects/os-lab-logo.jpg"
    github: "https://github.com/nicolasiskandar/os-lab"
    language: "C, Assembly"
  - name: "MiniPyTorch"
    description: "Minimal PyTorch-like deep learning library featuring Linear and convolutional layers, pooling, activation functions, explicit forward/backward propagation, SGD and Adam optimizers, and model serialization, with a NumPy frontend backed by C++17 and hand-written x86-64 assembly kernels"
    image: "assets/projects/minipytorch-logo.png"
    github: "https://github.com/nicolasiskandar/minipytorch"
    language: "Python, C++, Assembly"
  - name: "SAT Solver"
    description: "Boolean satisfiability solver implemented from scratch, featuring exhaustive enumeration, DPLL with unit propagation and pure-literal elimination, and CDCL with watched literals, first-UIP conflict analysis, non-chronological backtracking, and VSIDS branching, validated through property-based differential testing"
    image: "assets/projects/sat-solver-logo.jpg"
    github: "https://github.com/nicolasiskandar/sat-solver"
    language: "OCaml"
    image_fit: "cover"
  - name: "Nabla"
    description: "Compiled programming language for numerical computing featuring native matrix and array types, gradient and Jacobian computation via central finite differences, linear algebra operations, built-in statistical functions, and an LLVM-based JIT compiler"
    image: "assets/projects/nabla-logo.png"
    github: "https://github.com/nicolasiskandar/nabla"
    language: "C++, LLVM"
  - name: "Neural Prover"
    description: "LoRA fine-tuned language model for Lean 4 theorem proving, featuring next-tactic prediction, bounded best-first proof search, goal-aware tactic ranking, Mathlib proof-data extraction and preprocessing, and kernel-verified proof generation with automated axiom checks"
    image: "assets/projects/neuralprover-logo.png"
    github: "https://github.com/nicolasiskandar/neuralprover"
    language: "Python, Lean"
  - name: "Load Balancer"
    description: "Load balancer with round-robin scheduling and active health checks"
    image: "assets/projects/load-balancer-logo.png"
    github: "https://github.com/nicolasiskandar/load-balancer"
    language: "C++"
    image_fit: "cover"
  - name: "Parallel Algorithms"
    description: "Parallel Algorithms implementations showcasing concurrency and multithreading"
    image: "assets/projects/parallel-algorithms-logo.jpg"
    github: "https://github.com/nicolasiskandar/parallel-algorithms"
    language: "Java"
    image_fit: "cover"
  - name: "Game of Life"
    description: "Modular implementation of Conway's Game of Life in OCaml, featuring dense array-based and sparse set-based simulation engines, toroidal boundary handling, Run-Length Encoded pattern parsing, terminal animation, and graphical visualization"
    image: "assets/projects/game-of-life-logo.png"
    github: "https://github.com/nicolasiskandar/game-of-life"
    demo: "https://www.youtube.com/watch?v=a4c3ghskK5s"
    language: "OCaml"
  - name: "Proofs"
    description: "Formal verification project implementing machine-checked proofs of classical mathematical theorems in Lean 4, including Euclid's theorem, the Pigeonhole Principle, and inductive proof techniques"
    image: "assets/projects/proofs-logo.svg"
    github: "https://github.com/nicolasiskandar/proofs"
    language: "Lean"
  - name: "ML from Scratch"
    description: "From scratch implementations of classic ML algorithms"
    image: "assets/projects/ml-from-scratch-logo.png"
    github: "https://github.com/nicolasiskandar/ml-from-scratch"
    demo: "https://www.youtube.com/playlist?list=PL0C7PkqoHD_wM4obAuB-FQrVVYVhRlamt"
    language: "Python"
  - name: "Optimization Dynamics Lab"
    description: "From scratch numerical optimization framework implementing GD, momentum, Newton, SGD, backtracking line search, golden section, penalty, and Lagrange multipliers with finite-difference Gradient and Hessian estimation"
    image: "assets/projects/optimization-dynamics-lab-logo.png"
    github: "https://github.com/nicolasiskandar/optimization-dynamics-lab"
    demo: "https://www.youtube.com/watch?v=slsHDTdmXA4"
    language: "Python"
  - name: "Matrix Intelligence Lab"
    description: "Linear algebra framework implementing PCA, LU decomposition with partial pivoting, QR decomposition via Modified Gram-Schmidt, SVD image compression, and matrix factorization recommender system"
    image: "assets/projects/matrix-intelligence-lab-logo.png"
    github: "https://github.com/nicolasiskandar/matrix-intelligence-lab"
    demo: "https://www.youtube.com/watch?v=E6KKdT5BZ_4"
    language: "Python"
  - name: "Bayesian Inference Lab"
    description: "From-scratch Bayesian inference library implementing probability distributions, Metropolis-Hastings, Gibbs sampling, Hamiltonian Monte Carlo, NUTS, conjugate Bayesian inference, posterior predictive analysis, convergence diagnostics, and reverse-mode automatic differentiation"
    image: "assets/projects/bayesian-inference-lab-logo.jpg"
    github: "https://github.com/nicolasiskandar/bayesian-inference-lab"
    language: "Python"
    image_fit: "cover"
  - name: "Tic Tac Toe AI"
    description: "Unbeatable Tic Tac Toe AI using the Minimax algorithm"
    image: "assets/projects/tic-tac-toe-logo.png"
    github: "https://github.com/nicolasiskandar/tic-tac-toe-ai"
    language: "C++"
  - name: "Flappy Bird AI"
    description: "Flappy Bird-playing AI trained using NeuroEvolution of Augmenting Topologies (NEAT), featuring evolutionary neural network training, deterministic headless simulation, real-time visualization, and saved-genome replay"
    image: "assets/projects/flappy-bird-ai-logo.png"
    github: "https://github.com/nicolasiskandar/flappy-bird-ai"
    demo: "https://www.youtube.com/watch?v=7eUKCkaT8Z8"
    language: "Python"
    image_fit: "cover"
  - name: "EEG Cognitive-State Decoder"
    description: "EEG-based mental workload classification using the STEW dataset, featuring signal preprocessing, spectral feature extraction, classical ML baselines, CNN-based neural decoding, subject-independent evaluation, statistical significance testing, and ablation studies"
    image: "assets/projects/eeg-cognitive-state-decoder-logo.jpg"
    github: "https://github.com/nicolasiskandar/eeg-cognitive-state-decoder"
    language: "Python"
